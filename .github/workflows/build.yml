name: Build ffmpeg

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Check ffmpeg version
        run: |
          FFMPEG_VERSION=$(curl -s https://ffmpeg.org/releases/ | sed -nE 's/.*ffmpeg-([0-9.]+).tar.*/\1/p' | sort -V | tail -1)
          echo "FFMPEG_VERSION=$FFMPEG_VERSION" >> $GITHUB_ENV
          echo "Latest version is $FFMPEG_VERSION"

          REPO_RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          echo "Latest repo release is $REPO_RELEASE"

          if [[ "$FFMPEG_VERSION" == *"$REPO_RELEASE"* ]]; then
            echo "BUILD_NEEDED=0" >> "$GITHUB_ENV"
          else
            echo "BUILD_NEEDED=1" >> "$GITHUB_ENV"
          fi
      
      - name: Set up QEMU
        if: ${{ env.BUILD_NEEDED == 1 }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
          image: tonistiigi/binfmt:qemu-v8.1.5
          
      - name: Set up Docker Buildx
        if: ${{ env.BUILD_NEEDED == 1 }}
        uses: docker/setup-buildx-action@v4

      - name: Build the package
        if: ${{ env.BUILD_NEEDED == 1 }}
        run: |
          docker buildx build --load --tag ffmpeg ---platform linux/arm/v5 --allow security.insecure --no-cache --build-args FFMPEG_VERSION "${{ env.FFMPEG_VERSION }}" .

      - name: Extract the package
        if: ${{ env.BUILD_NEEDED == 1 }}
        shell: bash
        run: |
          docker create --name ffmpeg ffmpeg
          docker cp ffmpeg:./"ffmpeg_${{ env.FFMPEG_VERSION }}_armel.deb" "ffmpeg_${{ env.FFMPEG_VERSION }}_armel.deb" || echo "ffmpeg package not found"

      - name: Upload ffmpeg as a new release
        if: ${{ env.BUILD_NEEDED == 1 }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.REPO_TOKEN }}
          file: "*.deb"
          file_glob: true
          tag: ${{ env.FFMPEG_VERSION }}
          body: rustc ${{ env.FFMPEG_VERSION }} for armv5te (armel)
          overwrite: true