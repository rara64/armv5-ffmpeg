name: Build ffmpeg

on:
  workflow_dispatch:
  
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ffmpeg_version: ${{ steps.check-version.outputs.ffmpeg_version }}
      build_needed: ${{ steps.check-version.outputs.build_needed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check ffmpeg version
        id: check-version
        run: |
          FFMPEG_VERSION=$(curl -s https://ffmpeg.org/releases/ | sed -nE 's/.*ffmpeg-([0-9.]+).tar.*/\1/p' | sort -V | tail -1)
          echo "ffmpeg_version=8.1.2" >> $GITHUB_OUTPUT
          echo "Latest version is $FFMPEG_VERSION"

          REPO_RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          echo "Latest repo release is $REPO_RELEASE"

          if [[ "$FFMPEG_VERSION" == *"$REPO_RELEASE"* ]]; then
            echo "build_needed=0" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=1" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.build_needed == '1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - dockerfile: Dockerfile
            variant: armel
          - dockerfile: Dockerfile.optimized
            variant: armel_optimized
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
          image: tonistiigi/binfmt:qemu-v8.1.5
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the package
        run: |
          docker buildx build --load --tag ffmpeg --platform linux/arm/v5 --allow security.insecure --no-cache --build-arg FFMPEG_VERSION="${{ needs.check.outputs.FFMPEG_VERSION }}" --file ${{ matrix.dockerfile }} .

      - name: Extract the package
        shell: bash
        run: |
          docker create --name ffmpeg ffmpeg
          docker cp ffmpeg:./"ffmpeg_${{ needs.check.outputs.FFMPEG_VERSION }}_${{ matrix.variant }}.deb" "ffmpeg_${{ needs.check.outputs.FFMPEG_VERSION }}_${{ matrix.variant }}.deb" || echo "ffmpeg package not found"

      - name: Upload ffmpeg as a new release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.REPO_TOKEN }}
          file: "*.deb"
          file_glob: true
          tag: ${{ env.FFMPEG_VERSION }}
          body: ffmpeg ${{ env.FFMPEG_VERSION }} for armv5te (armel)
          overwrite: true